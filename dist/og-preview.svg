<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="950" cy="200" r="350" fill="url(#glow)" />
  <circle cx="200" cy="500" r="300" fill="url(#glow)" opacity="0.5" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Logo glyph -->
  <rect x="100" y="90" width="64" height="64" rx="16" fill="#142145" stroke="#06b6d4" stroke-width="2" />
  <path d="M116 122 L124 108 L132 136 L140 114 L148 122" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <text x="180" y="132" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="1">VOXARO</text>
  <rect x="330" y="108" width="130" height="26" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-opacity="0.4" />
  <text x="395" y="125" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">AUTOMOTIVE AI</text>

  <!-- Main Headline -->
  <text x="100" y="270" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="62" fill="#ffffff">
    Your AI Calling Team.
  </text>
  <text x="100" y="345" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="62" fill="url(#textGrad)">
    Built for Automotive Business.
  </text>

  <!-- Tagline -->
  <text x="100" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" fill="#94a3b8">
    Automate inbound and outbound customer calls with AI voice agents.
  </text>
  <text x="100" y="455" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" fill="#94a3b8">
    Follow up on leads, book test drives, and reduce call center costs.
  </text>

  <!-- Badges -->
  <g transform="translate(100, 520)">
    <rect width="210" height="42" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="105" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#38bdf8" font-weight="600" text-anchor="middle">Inbound 24/7 Reception</text>

    <rect x="230" width="220" height="42" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="340" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#38bdf8" font-weight="600" text-anchor="middle">Outbound Lead Follow-ups</text>

    <rect x="470" width="200" height="42" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="570" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#38bdf8" font-weight="600" text-anchor="middle">Human Staff Handover</text>
  </g>
</svg>
